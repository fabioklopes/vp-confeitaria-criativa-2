<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confeitaria Criativa | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #fff9f8, #ffe8ee);
        font-family: Arial, sans-serif;
      }
      .login-card {
        width: min(92vw, 420px);
        border: 1px solid #f3d9df;
        border-radius: 20px;
        background: white;
        box-shadow: 0 20px 50px rgba(173, 92, 114, 0.08);
        padding: 1.5rem;
      }
      .brand {
        color: #bd4f6d;
        font-weight: 800;
        font-size: 1.5rem;
      }
      .btn-primary {
        background: #d96a8b;
        border-color: #d96a8b;
      }
      .btn-primary:hover {
        background: #c9597c;
        border-color: #c9597c;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="text-center mb-4">
        <div class="brand"><i class="fa-solid fa-cake-candles me-2"></i>Confeitaria Criativa</div>
      </div>
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label">Usuário</label>
          <input class="form-control" name="usuario" placeholder="Digite seu usuário" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Senha</label>
          <input class="form-control" type="password" name="senha" placeholder="Digite sua senha" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
      </form>
      <div id="loginMessage" class="mt-3 text-center text-danger"></div>
    </div>

    <script>
      const form = document.getElementById('loginForm');
      const messageEl = document.getElementById('loginMessage');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = Object.fromEntries(new FormData(form).entries());

        try {
          const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || 'Erro ao fazer login.');
          }

          window.location.href = '/';
        } catch (error) {
          messageEl.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
