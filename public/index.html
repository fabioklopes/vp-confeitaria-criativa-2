<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confeitaria ERP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div class="wrapper">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <span class="material-symbols-outlined">cake</span>
        <div>
          <strong>Confeitaria</strong>
          <small>ERP de Gestão</small>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="#/dashboard" class="nav-link" data-rota="dashboard">
          <span class="material-symbols-outlined">space_dashboard</span> Dashboard
        </a>
        <div class="nav-separator">Cadastros</div>
        <a href="#/clientes" class="nav-link" data-rota="clientes">
          <span class="material-symbols-outlined">people</span> Clientes
        </a>
        <a href="#/campanhas" class="nav-link" data-rota="campanhas">
          <span class="material-symbols-outlined">campaign</span> Campanhas
        </a>
        <a href="#/medidas" class="nav-link" data-rota="medidas">
          <span class="material-symbols-outlined">straighten</span> Medidas
        </a>
        <a href="#/insumos" class="nav-link" data-rota="insumos">
          <span class="material-symbols-outlined">inventory_2</span> Insumos
        </a>
        <div class="nav-separator">Produção e Preço</div>
        <a href="#/receitas" class="nav-link" data-rota="receitas">
          <span class="material-symbols-outlined">menu_book</span> Receitas Prontas
        </a>
        <a href="#/precificacao" class="nav-link" data-rota="precificacao">
          <span class="material-symbols-outlined">sell</span> Precificação
        </a>
        <div class="nav-separator">Financeiro</div>
        <a href="#/caixa" class="nav-link" data-rota="caixa">
          <span class="material-symbols-outlined">account_balance_wallet</span> Fluxo de Caixa
        </a>
        <a href="#/relatorios" class="nav-link" data-rota="relatorios">
          <span class="material-symbols-outlined">summarize</span> Relatórios
        </a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="btn btn-outline-secondary d-lg-none" id="btnSidebar" type="button">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <h1 id="pageTitle" class="h4 mb-0">Dashboard</h1>
        <span id="clock" class="ms-auto text-muted small"></span>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <div id="modal-container"></div>
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
